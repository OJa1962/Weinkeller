// Dieselbe Farbsystematik wie bei der Säure (grün..rot), aber für die Bewertung fein
// abgestuft über alle 10 Punkte interpoliert (nicht nur in 5 groben Zweier-Blöcken).
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) {
  return "#" + [r, g, b].map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");
}
function mischeFarben(hexA, hexB, t) {
  const [r1, g1, b1] = hexToRgb(hexA);
  const [r2, g2, b2] = hexToRgb(hexB);
  return rgbToHex(r1 + (r2 - r1) * t, g1 + (g2 - g1) * t, b1 + (b2 - b1) * t);
}
const BEWERTUNG_ANKER = ["#BE3A2B", "#C97A3F", "#D6A24A", "#8CA84E", "#4E9B57"]; // 1 (rot) -> 10 (grün)
function bewertungFarbe(v) {
  const n = Math.min(10, Math.max(1, v || 1));
  const t = (n - 1) / 9; // 0..1 über die volle Skala 1-10
  const segAnzahl = BEWERTUNG_ANKER.length - 1;
  const segT = t * segAnzahl;
  const i = Math.min(segAnzahl - 1, Math.floor(segT));
  return mischeFarben(BEWERTUNG_ANKER[i], BEWERTUNG_ANKER[i + 1], segT - i);
}

function SaeureBar({ value = 3, typ, gl }) {
  const v = Math.min(5, Math.max(1, value));
  const color = SAEURE_COLORS[v - 1];
  const pos = ((v - 1) / 4) * 100;

  // "ausgewogen", ein Rotwein mit 7 g/l wäre dagegen extrem). Das muss im Label sichtbar sein,
  // sonst wirkt der Balken wie eine absolute Skala.
  const typLabel = typ ? ` (für ${typ})` : "";
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 10, color: "#A89C89", marginBottom: 5 }}>
        <span style={{ textTransform: "uppercase", letterSpacing: "0.04em" }}>Säure{typLabel}</span>

        <div style={{
          position: "absolute", top: "50%", left: `${pos}%`, transform: "translate(-50%, -50%)",
          width: 14, height: 14, borderRadius: "50%", background: "#FFFDF9",

      )}

  );
}

// Normalisiert einen Weingut-Namen für Vergleiche: entfernt Klammerzusätze (z.B. Rechtsform-Erklärungen)
// und gängige Rechtsform-Kürzel, damit "Weingut Moritz" und "Weingut Moritz (Rolf Anfehlig GmbH)"
// als dasselbe Weingut erkannt werden, auch wenn die Recherche mal mit, mal ohne Rechtsform liefert.
function weingutNormalisiert(s) {
  return (s || "")
    .toLowerCase()
    .replace(/\(.*?\)/g, " ")
    .replace(/\b(gmbh(\s*&\s*co\.?\s*kg)?|e\.?\s*k\.?|ohg|kg|lda\.?|ltda\.?|ltd\.?|limited|inc\.?|s\.?a\.?|sarl|s\.?r\.?l\.?|&\s*co\.?)\b/g, " ")
    .replace(/[.,]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function parseQuickText(text) {
  const out = {};
  text.split("\n").forEach((line) => {
    const idx = line.indexOf(":");
    if (idx === -1) return;
    const rawKey = line.slice(0, idx).trim().toLowerCase();
    const rawVal = line.slice(idx + 1).trim();
    const key = FIELD_MAP[rawKey];
    if (!key || !rawVal) return;
    if (key === "saeure" || key === "bewertung" || key === "anzahlFlaschen") {
      // Nur die führende Zahl nehmen (z.B. "3 (Ausgewogen) - 6,16 g/l..." -> 3),
      // nicht alle Ziffern im Text zusammenkleben (das ergäbe sonst z.B. 3616).
      const m = rawVal.match(/^\s*(\d+)/);
      const n = m ? parseInt(m[1], 10) : NaN;
      if (!isNaN(n)) out[key] = n;
    } else if (key === "cremig") {
      out[key] = /ja/i.test(rawVal) ? "Ja" : /nein/i.test(rawVal) ? "Nein" : "";
    } else if (key === "typ") {
      const v = rawVal.toLowerCase();
      if (v.includes("rot")) out[key] = "Rot";
      else if (v.includes("weiß") || v.includes("weiss")) out[key] = "Weiß";
      else if (v.includes("ros")) out[key] = "Rosé";
      else if (v.includes("champ")) out[key] = "Champagner";
      else if (v.includes("pet nat") || v.includes("pétillant") || v.includes("petnat")) out[key] = "PET NAT";
      else if (v.includes("schaum") || v.includes("sekt") || v.includes("crémant") || v.includes("cremant") || v.includes("prosecco") || v.includes("cava")) out[key] = "Schaumwein";
      else out[key] = rawVal;
    } else if (key === "favorit") {
      out[key] = /ja/i.test(rawVal);
    } else if (key === "alkohol") {
      // Nur die reine Zahl übernehmen (z.B. "12,5% vol" oder "12,5 % Vol." -> "12,5"),
      // da die Karten-Anzeige selbst schon "% Vol." anhängt - sonst stünde es doppelt da.
      const m = rawVal.match(/^\s*([\d.,]+)/);
      out[key] = m ? m[1] : rawVal;
    } else {
      out[key] = rawVal;
    }
  });
  return out;
}

function LabelThumb({ src, onClick }) {

  if (!src || failed) {
    return (

        <WineIcon size={16} color="#C9A961" />
      </div>
    );
  }
  return (
    <img src={src} alt="Etikett – zum Vergrößern antippen"

      style={{ width: 40, height: 52, objectFit: "cover", borderRadius: 4, border: "1px solid #E5DBC8", flexShrink: 0, cursor: onClick ? "pointer" : "default" }}
      onError={() => setFailed(true)} />

}

/* ---------- Cloud-Speicher (Firestore + Storage statt lokalem Gerätespeicher) ---------- */
const WINES_COLLECTION = "wines";

function waitForFirebase() {
  return new Promise((resolve) => {
    if (window.__fb) return resolve(window.__fb);
    window.addEventListener("fb-ready", () => resolve(window.__fb), { once: true });
  });
}

function subscribeWines(fb, onChange, onError) {
  return fb.onSnapshot(
    fb.collection(fb.db, WINES_COLLECTION),
    (snapshot) => {
      const list = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
      onChange(list);
    },
    (err) => onError(err)
  );
}

async function saveWineDoc(fb, wine) {
  const { id, ...data } = wine;
  await fb.setDoc(fb.doc(fb.db, WINES_COLLECTION, id), data, { merge: false });
}

async function deleteWineDoc(fb, id) {
  await fb.deleteDoc(fb.doc(fb.db, WINES_COLLECTION, id));
}

async function uploadLabelImage(fb, wineId, dataUrl) {
  const storageRef = fb.ref(fb.storage, `labels/${wineId}.jpg`);
  await fb.uploadString(storageRef, dataUrl, "data_url");
  return await fb.getDownloadURL(storageRef);
}

const ONLINE_BEZUGSQUELLEN = {
  "Webshop Weingut": null, // Domain je Weingut unterschiedlich -> allgemeine Google-Suche
  "Wein am Limit": "weinamlimit.de",
  "Wein am Limit Abo": "weinamlimit.de",
  "Lobenberg": "lobenberg.de",
  "Tesdorpf": "tesdorpf.de",
};

function buildShopSearchUrl(w) {
  const query = `${w.weingut || ""} ${w.weinname || ""}`.trim();
  if (!query) return null;
  const domain = ONLINE_BEZUGSQUELLEN[w.bezugsquelle];
  if (domain) {
    return `https://www.google.com/search?q=${encodeURIComponent(`site:${domain} ${query}`)}`;
  }
  return `https://www.google.com/search?q=${encodeURIComponent(`${query} kaufen`)}`;
}

          </span>
        )}
        {w.preis && <span>{w.preis} €</span>}
        {w.anzahlFlaschen && <span>🍾 {w.anzahlFlaschen} {String(w.anzahlFlaschen) === "1" ? "Flasche" : "Flaschen"}</span>}
      </div>

      {w.alternativeBezugsquelle && (
        <div style={{ marginTop: 6, fontSize: 12, color: "#A89C89" }}>🔗 Auch online bei: {w.alternativeBezugsquelle}</div>
      )}

      <div style={{ marginTop: 10 }}>
        <SaeureBar value={w.saeure || 3} typ={w.typ} gl={w.saeureGL} />
      </div>

      {w.typ === "Weiß" && w.cremig && <div style={{ marginTop: 10, fontSize: 12, color: "#7A6F63" }}>Cremig: {w.cremig}</div>}
      {w.wiederkaufen && <div style={{ marginTop: 6, fontSize: 12, color: "#7A6F63" }}>Wieder kaufen: {w.wiederkaufen}</div>}

      {/* Notizen: immer sichtbar, kurz, für private Vermerke */}
      {w.notizen && <div style={{ marginTop: 8, fontSize: 12, fontStyle: "italic", color: "#7A6F63" }}>{w.notizen}</div>}

      {!expanded && teaser && (
        <div style={{ marginTop: 8, fontSize: 12, color: "#A89C89" }}>{teaser}</div>
      )}

      {expanded && (
        <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 6 }}>
          {w.speiseempfehlung && <div style={{ fontSize: 12, color: "#7A6F63" }}>🍽️ Passt zu: {w.speiseempfehlung}</div>}
          {w.weinbeschreibung && <div style={{ fontSize: 12, color: "#7A6F63" }}>{w.weinbeschreibung}</div>}
          {w.regionBeschreibung && <div style={{ fontSize: 12, color: "#7A6F63" }}>📍 {w.regionBeschreibung}</div>}
          {w.hintergrundgeschichte && <div style={{ fontSize: 12, color: "#7A6F63" }}>{w.hintergrundgeschichte}</div>}
        </div>
      )}

      {hasMore && (
        <button onClick={() => setExpanded((e) => !e)}
          style={{ marginTop: 8, background: "none", border: "none", padding: 0, color: "#7A2038", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
          {expanded ? "Weniger anzeigen ▲" : "Mehr anzeigen ▼"}
        </button>
      )}
    </div>
  );
}

function Weinkeller({ onLogout }) {
  const [wines, setWines] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [fb, setFb] = useState(null);
  const [cloudError, setCloudError] = useState(false);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState(EMPTY_FORM);
  const [quickText, setQuickText] = useState("");
  const [quickApplied, setQuickApplied] = useState(false);
  const [sortBy1, setSortBy1] = useState("land");
  const [sortBy2, setSortBy2] = useState("keine");
  const [filterTyp, setFilterTyp] = useState("Alle");
  const [filterLand, setFilterLand] = useState("Alle");
  const [filterWeingut, setFilterWeingut] = useState("Alle");
  const [filterTraube, setFilterTraube] = useState("Alle");
  const [filterJahrgang, setFilterJahrgang] = useState("Alle");
  const [filterAnzahlFlaschen, setFilterAnzahlFlaschen] = useState("Alle");
  const [filterBezugsquelle, setFilterBezugsquelle] = useState("Alle");
  const [filterFavorit, setFilterFavorit] = useState("Alle");
  const [filterWiederkaufen, setFilterWiederkaufen] = useState("Alle");
  const [nurNeuesterJahrgang, setNurNeuesterJahrgang] = useState(false);
  const [suchtext, setSuchtext] = useState("");
  const [error, setError] = useState("");
  const [dirty, setDirty] = useState(false); // seit letztem Excel-Export geändert?
  const [savedFlash, setSavedFlash] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [lightbox, setLightbox] = useState(null);
  const [detailWine, setDetailWine] = useState(null);
  const [copyFlash, setCopyFlash] = useState(false);

  // Verbindung zu Firestore aufbauen und live auf Änderungen hören (auch von anderen Geräten)
  useEffect(() => {
    let unsubscribe = null;
    waitForFirebase().then((fbApi) => {
      setFb(fbApi);
      unsubscribe = subscribeWines(
        fbApi,
        (list) => {
          setWines(list);
          setLoaded(true);
          setCloudError(false);
        },
        (err) => {
          console.error(err);
          setCloudError(true);
          setLoaded(true);
        }
      );
    });
    return () => { if (unsubscribe) unsubscribe(); };
  }, []);

  // Ein einzelnes Weindokument in Firestore anlegen/aktualisieren
  async function persistWine(wine) {
    if (!fb) return;
    setDirty(true);
    try {
      await saveWineDoc(fb, wine);
      setSavedFlash(true);
      setTimeout(() => setSavedFlash(false), 1200);
    } catch (e) {
      console.error(e);
      setError("Speichern in der Cloud fehlgeschlagen. Bitte Internetverbindung prüfen und erneut versuchen.");
    }
  }

  function openNewForm() {
    // Neue Weine bekommen sofort eine feste Firestore-ID, damit ein hochgeladenes
    // Foto schon vor dem Speichern dem richtigen Dokument zugeordnet werden kann.
    const newId = fb ? fb.doc(fb.collection(fb.db, WINES_COLLECTION)).id : Date.now().toString();
    setForm({ ...EMPTY_FORM, id: newId });
    setQuickText("");
    setQuickApplied(false);
    setShowForm(true);
  }

  function openEditForm(wine) {
    setForm(wine);
    setQuickText("");
    setQuickApplied(false);
    setShowForm(true);
  }

  // Hebt ein Feld farblich hervor, solange es nach dem Übernehmen der Schnelleingabe
  // noch leer ist - Erinnerung an das, was noch manuell ausgefüllt werden muss.
  // Kräftige, klar sichtbare Füllfarbe statt nur dezenter Rahmenänderung, da ein
  // zu heller Ton in der ohnehin cremefarbenen Optik der App kaum auffällt.
  function leerStil(val) {
    const isEmpty = val === "" || val === null || val === undefined;
    return quickApplied && isEmpty
      ? { border: "2px solid #C9A961", background: "#FBE3A1" }
      : {};
  }

  function resizeImageDataUrl(dataUrl, maxDim = 1400, quality = 0.82) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = dataUrl;
    });
  }

  function handleFileUpload(field, file) {
    if (!file || !fb || !form.id) return;
    setUploading(true);
    setError("");
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const resized = await resizeImageDataUrl(reader.result);
        const url = await uploadLabelImage(fb, form.id, resized);
        setForm((f) => ({ ...f, [field]: url }));
      } catch (e) {
        console.error(e);
        setError("Foto-Upload fehlgeschlagen. Bitte erneut versuchen.");
      } finally {
        setUploading(false);
      }
    };
    reader.readAsDataURL(file);
  }

  function applyQuickText() {
    const parsed = parseQuickText(quickText);
    setForm((f) => ({ ...f, ...parsed }));
    setQuickApplied(true);
  }

  function saveForm() {
    if (!form.weinname.trim()) {
      setError("Bitte mindestens einen Weinnamen angeben.");
      return;
    }
    setError("");
    const wine = form.hinzugefuegt ? form : { ...form, hinzugefuegt: new Date().toISOString() };
    persistWine(wine);
    setShowForm(false);
  }

  function deleteWine(id) {
    if (!fb) return;
    deleteWineDoc(fb, id).catch((e) => {
      console.error(e);
      setError("Löschen fehlgeschlagen. Bitte Internetverbindung prüfen.");
    });
  }

  function toggleFavorit(id) {
    const wine = wines.find((w) => w.id === id);
    if (!wine) return;
    persistWine({ ...wine, favorit: !wine.favorit });
  }

  const laender = useMemo(() => Array.from(new Set(wines.map((w) => w.land).filter(Boolean))).sort(), [wines]);
  const weingueter = useMemo(() => Array.from(new Set(wines.map((w) => w.weingut).filter(Boolean))).sort(), [wines]);
  const trauben = useMemo(() => Array.from(new Set(wines.map((w) => w.traube).filter(Boolean))).sort(), [wines]);
  const jahrgaenge = useMemo(() => Array.from(new Set(wines.map((w) => w.jahrgang).filter(Boolean))).sort((a, b) => b - a), [wines]);

  function sortValue(w, key) {
    switch (key) {
      case "land": return (w.land || "").toLowerCase();
      case "jahrgang": return -(w.jahrgang || 0);
      case "bewertung": return -(w.bewertung || 0);
      case "weingut": return (w.weingut || "").toLowerCase();
      case "traube": return (w.traube || "").toLowerCase();
      case "typ": return (w.typ || "").toLowerCase();
      case "neu": return w.hinzugefuegt ? -new Date(w.hinzugefuegt).getTime() : 0;
      case "anzahlFlaschen": return -(parseFloat(w.anzahlFlaschen) || 0);
      default: return 0;
    }
  }

  const filtered = useMemo(() => {
    let list = [...wines];
    if (suchtext.trim()) {
      const q = suchtext.trim().toLowerCase();
      list = list.filter((w) => {
        const haystack = [
          w.weinname, w.weingut, w.traube, w.land, w.region,
          w.notizen, w.weinbeschreibung, w.speiseempfehlung, w.hintergrundgeschichte,
        ].filter(Boolean).join(" ").toLowerCase();
        return haystack.includes(q);
      });
    }
    if (filterTyp !== "Alle") list = list.filter((w) => w.typ === filterTyp);
    if (filterLand !== "Alle") list = list.filter((w) => w.land === filterLand);
    if (filterWeingut !== "Alle") list = list.filter((w) => w.weingut === filterWeingut);
    if (filterTraube !== "Alle") list = list.filter((w) => w.traube === filterTraube);
    if (filterJahrgang !== "Alle") list = list.filter((w) => String(w.jahrgang) === String(filterJahrgang));
    if (filterAnzahlFlaschen === "vorhanden") list = list.filter((w) => parseFloat(w.anzahlFlaschen) > 0);
    if (filterAnzahlFlaschen === "keine") list = list.filter((w) => !(parseFloat(w.anzahlFlaschen) > 0));
    if (filterBezugsquelle !== "Alle") list = list.filter((w) => w.bezugsquelle === filterBezugsquelle);
    if (filterFavorit !== "Alle") list = list.filter((w) => (filterFavorit === "Ja" ? w.favorit : !w.favorit));
    if (filterWiederkaufen !== "Alle") list = list.filter((w) => w.wiederkaufen === filterWiederkaufen);

    // Ältere Jahrgänge desselben Weins ausblenden (nur Anzeige, nichts wird gelöscht) -
    // hilfreich für die Frage "was kann ich aktuell nachbestellen?", ohne die Historie/Notizen zu verlieren.
    if (nurNeuesterJahrgang) {
      const neuesterProWein = {};
      wines.forEach((w) => {
        const key = `${weingutNormalisiert(w.weingut)}|${(w.weinname || "").toLowerCase()}`;
        const j = parseInt(w.jahrgang, 10) || 0;
        if (!(key in neuesterProWein) || j > neuesterProWein[key]) neuesterProWein[key] = j;
      });
      list = list.filter((w) => {
        const key = `${weingutNormalisiert(w.weingut)}|${(w.weinname || "").toLowerCase()}`;
        const j = parseInt(w.jahrgang, 10) || 0;
        return j === neuesterProWein[key];
      });
    }

    list.sort((a, b) => {
      const v1 = sortValue(a, sortBy1);
      const v2 = sortValue(b, sortBy1);
      if (v1 < v2) return -1;
      if (v1 > v2) return 1;
      if (sortBy2 !== "keine") {
        const s1 = sortValue(a, sortBy2);
        const s2 = sortValue(b, sortBy2);
        if (s1 < s2) return -1;
        if (s1 > s2) return 1;
      }
      return 0;
    });
    list.sort((a, b) => (b.favorit ? 1 : 0) - (a.favorit ? 1 : 0));
    return list;
  }, [wines, suchtext, filterTyp, filterLand, filterWeingut, filterTraube, filterJahrgang, filterAnzahlFlaschen, filterBezugsquelle, filterFavorit, filterWiederkaufen, nurNeuesterJahrgang, sortBy1, sortBy2]);

  function copyForClaude() {
    const lines = filtered.map((w) => {
      const kurzbeschreibung = w.weinbeschreibung
        ? w.weinbeschreibung.split(/(?<=[.!?])\s+/).slice(0, 1).join(" ")
        : "";
      const parts = [
        `${w.weinname || "—"} (${w.weingut || "?"}${w.jahrgang ? ", " + w.jahrgang : ""})`,
        w.typ && `Typ: ${w.typ}`,
        w.traube && `Rebsorte: ${w.traube}`,
        w.land && `Land: ${w.land}${w.region ? ", " + w.region : ""}`,
        w.saeure && `Säure: ${w.saeure}/5`,
        w.anzahlFlaschen !== "" && w.anzahlFlaschen != null && `Flaschen vorhanden: ${w.anzahlFlaschen}`,
        w.bewertung && `Bewertung: ${w.bewertung}/10`,
        w.speiseempfehlung && `Passt zu: ${w.speiseempfehlung}`,
        kurzbeschreibung && `Beschreibung: ${kurzbeschreibung}`,
        w.notizen && `Notizen: ${w.notizen}`,
      ].filter(Boolean);
      return "- " + parts.join(" | ");
    });
    const text = `Meine Weinliste (${filtered.length} Einträge, aktueller Filter):\n\n${lines.join("\n")}`;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        () => { setCopyFlash(true); setTimeout(() => setCopyFlash(false), 1500); },
        () => setError("Kopieren fehlgeschlagen. Bitte manuell markieren.")
      );
    }
  }

  function exportExcel() {
    const rows = wines.map((w) => ({
      Weingut: w.weingut, Weinname: w.weinname, Land: w.land, Region: w.region,
      Jahrgang: w.jahrgang, Rebsorte: w.traube, "Alkohol (%)": w.alkohol,
      "Säure (1-5)": w.saeure, "Gesamtsäure (g/l)": w.saeureGL, Typ: w.typ, Cremig: w.typ === "Weiß" ? w.cremig : "",
      Bezugsquelle: w.bezugsquelle, "Alternative Bezugsquelle (online)": w.alternativeBezugsquelle, "Preis (€)": w.preis, "Anzahl Flaschen": w.anzahlFlaschen, "Bewertung (1-10)": w.bewertung,
      Weinbeschreibung: w.weinbeschreibung, Speiseempfehlung: w.speiseempfehlung, "Region kurz vorgestellt": w.regionBeschreibung, Hintergrundgeschichte: w.hintergrundgeschichte,
      "Wieder kaufen": w.wiederkaufen, Notizen: w.notizen, Favorit: w.favorit ? "Ja" : "Nein",
      Etikett: w.etikettVorne || "",
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Weinkeller");
    const wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    const blob = new Blob([wbout], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });

    // Dateiname mit Zeitstempel, damit beim wiederholten Sichern eindeutig erkennbar ist,
    // welche Datei die aktuellste ist (statt "weinkeller (1).xlsx", "weinkeller (2).xlsx" ...)
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    const stamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
    const filename = `weinkeller-${stamp}.xlsx`;
    const file = new File([blob], filename, { type: blob.type });

    // "In Dateien sichern" (Teilen-Menü) nur auf iPhone/iPad anbieten - am Mac/Desktop
    // soll ein ganz normaler Browser-Download in den Downloads-Ordner laufen.
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    if (isIOS && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).then(() => setDirty(false)).catch(() => {});
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setDirty(false);
  }

  function wineKey(w) {
    return [weingutNormalisiert(w.weingut), w.weinname, w.jahrgang].join("|").toLowerCase().trim();
  }

  function importExcel(e) {
    const file = e.target.files && e.target.files[0];
    if (!file || !fb) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type: "array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });

        // Abgleich statt Überschreiben: pro Zeile prüfen, ob der Wein (Weingut+Name+Jahrgang)
        // schon in der Cloud existiert, und dann aktualisieren statt zu duplizieren.
        const existingByKey = {};
        wines.forEach((w) => { existingByKey[wineKey(w)] = w; });

        const writes = rows.map((r, i) => {
          const parsed = {
            weingut: String(r["Weingut"] || ""), weinname: String(r["Weinname"] || ""),
            land: String(r["Land"] || ""), region: String(r["Region"] || ""),
            jahrgang: parseInt(r["Jahrgang"], 10) || "", traube: String(r["Rebsorte"] || ""),
            alkohol: String(r["Alkohol (%)"] || ""), saeure: parseInt(r["Säure (1-5)"], 10) || 3,
            saeureGL: String(r["Gesamtsäure (g/l)"] || ""),
            typ: String(r["Typ"] || ""), cremig: String(r["Cremig"] || ""),
            bezugsquelle: String(r["Bezugsquelle"] || ""), alternativeBezugsquelle: String(r["Alternative Bezugsquelle (online)"] || ""), preis: String(r["Preis (€)"] || ""),
            weinbeschreibung: String(r["Weinbeschreibung"] || ""), speiseempfehlung: String(r["Speiseempfehlung"] || ""),
            hintergrundgeschichte: String(r["Hintergrundgeschichte"] || ""),
            regionBeschreibung: String(r["Region kurz vorgestellt"] || ""),
            anzahlFlaschen: String(r["Anzahl Flaschen"] || ""),
            bewertung: parseInt(r["Bewertung (1-10)"], 10) || 5,
            wiederkaufen: String(r["Wieder kaufen"] || ""), notizen: String(r["Notizen"] || ""),
            favorit: String(r["Favorit"] || "").toLowerCase() === "ja",
            etikettVorne: String(r["Etikett"] || ""),
          };
          const existing = existingByKey[wineKey(parsed)];
          const wine = existing
            ? { ...existing, ...parsed, etikettVorne: parsed.etikettVorne || existing.etikettVorne || "" }
            : { ...parsed, id: fb.doc(fb.collection(fb.db, WINES_COLLECTION)).id, hinzugefuegt: new Date().toISOString() };
          return saveWineDoc(fb, wine);
        });

        await Promise.all(writes);
        setDirty(false);
        setError("");
      } catch (err) {
        console.error(err);
        setError("Datei konnte nicht gelesen werden. Bitte eine mit dieser App exportierte Excel-Datei wählen.");
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = "";
  }

  return (
    <div style={{ minHeight: "100vh", background: "#F5F0E6", fontFamily: "'Inter', system-ui, sans-serif", color: "#2B2320" }}>
      <div style={{ maxWidth: 720, margin: "0 auto", padding: "24px 16px 80px" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <WineIcon size={26} color="#7A2038" />
            <h1 className="display-font" style={{ fontSize: 28, fontWeight: 700, margin: 0 }}>
              Weinkeller <span style={{ fontSize: 15, fontWeight: 600, color: "#B8935F", verticalAlign: "middle" }}>OJ</span>
            </h1>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <label style={{ display: "flex", alignItems: "center", gap: 6, background: "#FFFDF9", border: "1px solid #DDD2BE", borderRadius: 8, padding: "8px 12px", fontSize: 13, cursor: "pointer", margin: 0, textTransform: "none", letterSpacing: 0, color: "#2B2320", fontWeight: 500 }}>
              <Upload size={15} /> Laden
              <input type="file" accept=".xlsx,.xls" onChange={importExcel} style={{ display: "none" }} />
            </label>
            <button onClick={exportExcel}
              style={{ display: "flex", alignItems: "center", gap: 6, background: dirty ? "#7A2038" : "#FFFDF9", color: dirty ? "#FFFDF9" : "#2B2320", border: "1px solid " + (dirty ? "#7A2038" : "#DDD2BE"), borderRadius: 8, padding: "8px 12px", fontSize: 13, cursor: "pointer" }}>
              <Download size={15} /> Sichern
            </button>
            <button onClick={onLogout} title="Abmelden"
              style={{ display: "flex", alignItems: "center", gap: 6, background: "#FFFDF9", border: "1px solid #DDD2BE", borderRadius: 8, padding: "8px 10px", fontSize: 13, cursor: "pointer", color: "#7A6F63" }}>
              <X size={15} />
            </button>
          </div>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: savedFlash ? "#4E9B57" : "#B7AB98", marginTop: -12, marginBottom: 14, height: 14, transition: "color 0.3s" }}>
          {savedFlash ? "✓ in der Cloud gespeichert – auf allen Geräten sichtbar" : (!loaded ? "Verbindung wird hergestellt…" : "\u00A0")}
        </div>

        {cloudError && (
          <div style={{ background: "#FBEAEA", border: "1px solid #E5B8B4", borderRadius: 8, padding: "10px 12px", fontSize: 13, marginBottom: 14, color: "#8A3A34" }}>
            Keine Verbindung zur Cloud-Datenbank. Prüfe deine Internetverbindung – Änderungen können gerade nicht gespeichert werden.
          </div>
        )}

        {dirty && !cloudError && (
          <div style={{ background: "#FBF3E4", border: "1px solid #E3D3B0", borderRadius: 8, padding: "10px 12px", fontSize: 13, marginBottom: 14, color: "#6B5940" }}>
            Deine Daten werden automatisch in der Cloud gespeichert und mit allen Geräten synchronisiert. „Sichern" legt zusätzlich eine Excel-Sicherungskopie an.
          </div>
        )}

        <div style={{ marginBottom: 12 }}>
          <input
            type="text"
            value={suchtext}
            onChange={(e) => setSuchtext(e.target.value)}
            placeholder="Suche: Weinname, Weingut, Rebsorte, Land, Notizen…"

              <div style={{ gridColumn: "1 / -1" }}>
                <label>Notizen (eure eigenen Eindrücke)</label>
                <textarea rows={2} value={form.notizen} onChange={(e) => setForm({ ...form, notizen: e.target.value })} />
              </div>
              <div>
                <label>Etikett vorne</label>
                <div style={{ display: "flex", gap: 6 }}>
                  <input placeholder="Bild-URL einfügen" value={form.etikettVorne} onChange={(e) => setForm({ ...form, etikettVorne: e.target.value })} disabled={uploading} style={leerStil(form.etikettVorne)} />
                  <label style={{ display: "flex", alignItems: "center", justifyContent: "center", width: 38, flexShrink: 0, background: "#EFE6D3", border: "1px solid #DDD2BE", borderRadius: 8, cursor: uploading ? "default" : "pointer", opacity: uploading ? 0.6 : 1 }}>
                    <Upload size={15} />
                    <input type="file" accept="image/*" style={{ display: "none" }} disabled={uploading} onChange={(e) => handleFileUpload("etikettVorne", e.target.files[0])} />
                  </label>
                </div>
                <div style={{ fontSize: 11, color: "#A89C89", marginTop: 4 }}>
                  {uploading ? "Foto wird verkleinert und hochgeladen…" : "Foto über 📤 hochladen – wird automatisch verkleinert, in der Cloud gespeichert und ist auf allen Geräten sichtbar (zum Vergrößern antippen)."}
                </div>
              </div>
              <div>
                <label>Favorit</label>
                <button type="button" onClick={() => setForm({ ...form, favorit: !form.favorit })} style={{ display: "flex", alignItems: "center", gap: 6, background: "#FFFDF9", border: "1px solid #DDD2BE", borderRadius: 8, padding: "8px 10px", cursor: "pointer", width: "100%" }}>
                  <Star size={22} color={form.favorit ? "#C9A961" : "#D8CDB8"} fill={form.favorit ? "#C9A961" : "none"} />
                  <span style={{ fontSize: 14 }}>{form.favorit ? "Favorit" : "Kein Favorit"}</span>
                </button>
              </div>
            </div>

            {error && <div style={{ color: "#B0453F", fontSize: 13, marginTop: 10 }}>{error}</div>}

            <button onClick={saveForm} disabled={uploading} style={{ marginTop: 16, width: "100%", background: uploading ? "#B79A8A" : "#7A2038", color: "#FFFDF9", border: "none", borderRadius: 10, padding: 12, fontSize: 14, fontWeight: 600, cursor: uploading ? "default" : "pointer" }}>
              Speichern
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function Login() {
  const [fb, setFb] = useState(null);
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    waitForFirebase().then(setFb);
  }, []);

  function submit(e) {
    e.preventDefault();
    if (!fb) return;
    setBusy(true);
    setError("");
    fb.signInWithEmailAndPassword(fb.auth, email.trim(), password)
      .catch((err) => {
        console.error(err);
        setError("Anmeldung fehlgeschlagen. E-Mail oder Passwort prüfen.");
      })
      .finally(() => setBusy(false));
  }

  return (
    <div style={{ minHeight: "100vh", background: "#F5F0E6", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <form onSubmit={submit} style={{ background: "#FFFDF9", border: "1px solid #E5DBC8", borderRadius: 14, padding: 28, width: "100%", maxWidth: 360 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 18 }}>
          <WineIcon size={24} color="#7A2038" />
          <h1 className="display-font" style={{ fontSize: 22, margin: 0 }}>Weinkeller</h1>
        </div>
        <div style={{ marginBottom: 12 }}>
          <label>E-Mail</label>
          <input type="email" autoCapitalize="none" value={email} onChange={(e) => setEmail(e.target.value)} required />
        </div>
        <div style={{ marginBottom: 16 }}>
          <label>Passwort</label>
          <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required />
        </div>
        {error && <div style={{ color: "#B0453F", fontSize: 13, marginBottom: 12 }}>{error}</div>}
        <button type="submit" disabled={busy || !fb} style={{ width: "100%", background: "#7A2038", color: "#FFFDF9", border: "none", borderRadius: 10, padding: 12, fontSize: 14, fontWeight: 600, cursor: busy ? "default" : "pointer", opacity: busy || !fb ? 0.7 : 1 }}>
          {busy ? "Anmelden…" : "Anmelden"}
        </button>
      </form>
    </div>
  );
}

function AuthGate() {
  const [fb, setFb] = useState(null);
  const [user, setUser] = useState(undefined); // undefined = wird noch geprüft, null = nicht angemeldet

  useEffect(() => {
    let unsubscribe = null;
    waitForFirebase().then((fbApi) => {
      setFb(fbApi);
      unsubscribe = fbApi.onAuthStateChanged(fbApi.auth, (u) => setUser(u || null));
    });
    return () => { if (unsubscribe) unsubscribe(); };
  }, []);

  if (user === undefined) {
    return (
      <div style={{ minHeight: "100vh", background: "#F5F0E6", display: "flex", alignItems: "center", justifyContent: "center", color: "#7A6F63", fontSize: 13 }}>
        Anmeldestatus wird geprüft…
      </div>
    );
  }
  if (!user) return <Login />;
  return <Weinkeller onLogout={() => fb.signOut(fb.auth)} />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AuthGate />);
</script>
</body>
</html>
