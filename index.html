// Dieselbe Farbsystematik wie bei der Säure (grün..rot), aber für die Bewertung fein
// abgestuft über alle 10 Punkte interpoliert (nicht nur in 5 groben Zweier-Blöcken).
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) {
  return "#" + [r, g, b].map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");
}
function mischeFarben(hexA, hexB, t) {
  const [r1, g1, b1] = hexToRgb(hexA);
  const [r2, g2, b2] = hexToRgb(hexB);
  return rgbToHex(r1 + (r2 - r1) * t, g1 + (g2 - g1) * t, b1 + (b2 - b1) * t);
}
const BEWERTUNG_ANKER = ["#BE3A2B", "#C97A3F", "#D6A24A", "#8CA84E", "#4E9B57"]; // 1 (rot) -> 10 (grün)
function bewertungFarbe(v) {
  const n = Math.min(10, Math.max(1, v || 1));
  const t = (n - 1) / 9; // 0..1 über die volle Skala 1-10
  const segAnzahl = BEWERTUNG_ANKER.length - 1;
  const segT = t * segAnzahl;
  const i = Math.min(segAnzahl - 1, Math.floor(segT));
  return mischeFarben(BEWERTUNG_ANKER[i], BEWERTUNG_ANKER[i + 1], segT - i);
}

// Normalisiert einen Weingut-Namen für Vergleiche: entfernt Klammerzusätze (z.B. Rechtsform-Erklärungen)
// und gängige Rechtsform-Kürzel, damit "Weingut Moritz" und "Weingut Moritz (Rolf Anfehlig GmbH)"
// als dasselbe Weingut erkannt werden, auch wenn die Recherche mal mit, mal ohne Rechtsform liefert.
function weingutNormalisiert(s) {
  return (s || "")
    .toLowerCase()
    .replace(/\(.*?\)/g, " ")
    .replace(/\b(gmbh(\s*&\s*co\.?\s*kg)?|e\.?\s*k\.?|ohg|kg|lda\.?|ltda\.?|ltd\.?|limited|inc\.?|s\.?a\.?|sarl|s\.?r\.?l\.?|&\s*co\.?)\b/g, " ")
    .replace(/[.,]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

// Restaurant/Weinbar vor den Ort setzen, z. B. "Kimdo Weinbar, Hamburg-Winterhude"
function mitRestaurant(ort, name) {
  if (!name) return ort || "";
  if (!ort) return name;
  return ort.startsWith(name) ? ort : `${name}, ${ort}`;
}

// Beim Wechsel des Restaurants den alten Namen im Ort durch den neuen ersetzen
function restaurantWechseln(ort, altName, neuName) {
  let teil = ort || "";
  if (altName && teil.startsWith(altName + ", ")) teil = teil.slice(altName.length + 2);
  else if (altName && teil === altName) teil = "";
  return mitRestaurant(teil, neuName);
}

// Liest "lat, lon" (Punkt oder Komma als Dezimalzeichen) und liefert [lat, lon] oder null.
function gpsAusText(s) {
  const m = String(s || "").match(/(-?\d+(?:[.,]\d+)?)\s*[,;\s]\s*(-?\d+(?:[.,]\d+)?)/);
  if (!m) return null;
  const lat = parseFloat(m[1].replace(",", "."));
  const lon = parseFloat(m[2].replace(",", "."));
  if (isNaN(lat) || isNaN(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
  return [lat, lon];
}

function parseQuickText(text) {
  const out = {};
  text.split("\n").forEach((line) => {
    const idx = line.indexOf(":");
    if (idx === -1) return;
    const rawKey = line.slice(0, idx).trim().toLowerCase();
    const rawVal = line.slice(idx + 1).trim();
    const key = FIELD_MAP[rawKey];
    if (!key || !rawVal) return;
    if (key === "saeure" || key === "bewertung" || key === "anzahlFlaschen" || key === "dekantierzeit") {
      // Nur die führende Zahl nehmen (z.B. "3 (Ausgewogen) - 6,16 g/l..." -> 3),
      // nicht alle Ziffern im Text zusammenkleben (das ergäbe sonst z.B. 3616).
      const m = rawVal.match(/^\s*(\d+)/);
      const n = m ? parseInt(m[1], 10) : NaN;
      if (!isNaN(n)) out[key] = n;
    } else if (key === "cremig") {
      out[key] = /ja/i.test(rawVal) ? "Ja" : /nein/i.test(rawVal) ? "Nein" : "";
    } else if (key === "nurVorOrtErhaeltlich") {
      out[key] = /ja/i.test(rawVal) ? "Ja" : /nein/i.test(rawVal) ? "Nein" : "";
    } else if (key === "dekantieren") {
      out[key] = /ja/i.test(rawVal) ? "Ja" : /nein/i.test(rawVal) ? "Nein" : "";
      // Manchmal steht die Stundenzahl direkt in derselben Zeile (z.B. "Ja (1 Std. vorher)")
      // statt in einer eigenen "Dekantierzeit"-Zeile - dann hilfsweise hier mit herausziehen.
      if (out[key] === "Ja" && !out.dekantierzeit) {
        const m2 = rawVal.match(/([\d.,]+)\s*(std|stunde)/i);
        if (m2) out.dekantierzeit = m2[1];
      }
    } else if (key === "dekantierzeit") {
      // Nur die führende Zahl nehmen und ein mitgeliefertes "Stunde(n)" entfernen
      // (z.B. "2 Stunden vorher" -> "2"), da die Anzeige die Einheit selbst anhängt.
      const m = rawVal.match(/^\s*([\d.,]+)/);
      out[key] = m ? m[1] : rawVal;
    } else if (key === "typ") {
      const v = rawVal.toLowerCase();
      if (v.includes("rot")) out[key] = "Rot";
      else if (v.includes("weiß") || v.includes("weiss")) out[key] = "Weiß";
      else if (v.includes("ros")) out[key] = "Rosé";
      else if (v.includes("champ")) out[key] = "Champagner";
      else if (v.includes("pet nat") || v.includes("pétillant") || v.includes("petnat")) out[key] = "PET NAT";
      else if (v.includes("schaum") || v.includes("sekt") || v.includes("crémant") || v.includes("cremant") || v.includes("prosecco") || v.includes("cava")) out[key] = "Schaumwein";
      else if (v === "sake" || v.startsWith("sake")) out[key] = "Sake";
      else if (v.includes("süßwein") || v.includes("süss") || v.includes("dessertwein") || v.includes("auslese") || v.includes("beerenauslese") || v.includes("eiswein") || v.includes("sauternes") || v.includes("tokaji") || v.includes("tokay")) out[key] = "Süßwein";
      else out[key] = rawVal;
    } else if (key === "favorit" || key === "favoritBJ") {
      out[key] = /ja/i.test(rawVal);
    } else if (key === "alkohol") {
      // Nur die reine Zahl übernehmen (z.B. "12,5% vol" oder "12,5 % Vol." -> "12,5"),
      // da die Karten-Anzeige selbst schon "% Vol." anhängt - sonst stünde es doppelt da.
      const m = rawVal.match(/^\s*([\d.,]+)/);
      out[key] = m ? m[1] : rawVal;
    } else if (key === "preis") {
      // Ein mitgeliefertes "€" entfernen (z.B. "24,30 €" oder "ca. 25 €" -> ohne €-Zeichen),
      // das "ca."-Präfix aber erhalten - die Anzeige hängt das €-Zeichen selbst schon an.
      out[key] = rawVal.replace(/\s*€\s*$/, "").trim();
    } else if (key === "saeureGL") {
      // Analog: ein mitgeliefertes "g/l" entfernen, da die Anzeige es selbst schon anhängt.
      out[key] = rawVal.replace(/\s*g\s*\/\s*l\s*$/i, "").trim();
    } else {
      out[key] = rawVal;
    }
  });
  return out;
}

const WINES_COLLECTION = "wines";

function waitForFirebase() {
  return new Promise((resolve) => {
    if (window.__fb) return resolve(window.__fb);
    window.addEventListener("fb-ready", () => resolve(window.__fb), { once: true });
  });
}

function subscribeWines(fb, onChange, onError) {
  return fb.onSnapshot(
    fb.collection(fb.db, WINES_COLLECTION),
    (snapshot) => {
      const list = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
      onChange(list);
    },
    (err) => onError(err)
  );
}

async function saveWineDoc(fb, wine) {
  const { id, ...data } = wine;
  await fb.setDoc(fb.doc(fb.db, WINES_COLLECTION, id), data, { merge: false });
}

async function deleteWineDoc(fb, id) {
  await fb.deleteDoc(fb.doc(fb.db, WINES_COLLECTION, id));
}

// Shops mit direkter Suche im Shop selbst (Such-Adressen am 20.10. im Browser geprüft):
// Wein am Limit, Lobenberg (gute-weine.de), Tesdorpf, Sake Kontor.
const DIREKTE_SHOPS = ["weinamlimit.de", "gute-weine.de", "tesdorpf.de", "sake-kontor.de"];

// Direkte Suche im Shop (Wein am Limit: shop.weinamlimit.de/search?search=Weinname).
// Für Shops ohne bekanntes Such-Muster bleibt die eingeschränkte Google-Suche.
function shopSucheUrl(domain, w) {
  const name = String(w.weinname || "").trim();
  const enc = encodeURIComponent(name);
  if (domain === "weinamlimit.de") return `https://shop.weinamlimit.de/search?search=${enc}`;
  if (domain === "gute-weine.de") return `https://www.gute-weine.de/suche/?tx_solr%5Bq%5D=${enc}`;
  if (domain === "tesdorpf.de") return `https://www.tesdorpf.de/search/?q=${enc}`;
  if (domain === "sake-kontor.de") return `https://www.sake-kontor.de/?s=${enc}`;
  const query = `${w.weingut || ""} ${name}`.trim();
  return `https://www.google.de/search?q=${encodeURIComponent(`site:${domain} ${query}`)}`;
}

// Sake: Säurewert (San-do) aus dem Gesamtsäure-Wert (g/l) ableiten
function sakeSaeure(gl) {
  const v = parseFloat(String(gl).replace(",", "."));
  if (isNaN(v)) return "";
  if (v < 1.0) return 1;
  if (v < 1.3) return 2;
  if (v < 1.6) return 3;
  if (v < 1.9) return 4;
  return 5;
}

// Preis nur mit € anzeigen, wenn es eine reine Zahl ist (z. B. "24,30" oder "ca. 25").
// Freier Text mit Zahl (z. B. "Ca. 36 € (Schätzung …)") wird unverändert gezeigt,
// Text ohne Zahl (z. B. "Kein verlässlicher Preis …") wird gar nicht angezeigt.
function preisAnzeige(p) {
  const s = String(p ?? "").trim();
  if (!/\d/.test(s)) return "";
  if (/^(ca\.?\s*)?\d[\d.,\s]*$/i.test(s)) return `${s} €`;
  return s;
}

// Link nur anzeigen, wenn es eine echte Web-Adresse ist.
function linkGueltig(s) {
  return /^https?:\/\//i.test(String(s ?? "").trim());
}

// Name des Händlers aus der Adresse ableiten (bekannte Shops mit Namen, sonst die Domain)
function haendlerAusLink(url) {
  let host = "";
  try { host = new URL(String(url)).hostname.replace(/^www\./, "").replace(/^shop\./, ""); } catch (e) { host = ""; }
  const bekannt = { "weinamlimit.de": "Wein am Limit", "gute-weine.de": "Lobenberg", "tesdorpf.de": "Tesdorpf", "sake-kontor.de": "Sake Kontor" };
  return bekannt[host] || host || "Händler";
}

// Händler-Link bereinigen: Tracking-Parameter (utm_, mc_, ct) entfernen.
function linkBereinigen(s) {
  const t = String(s ?? "").trim();
  if (!/^https?:\/\//i.test(t)) return t;
  try {
    const u = new URL(t);
    for (const k of [...u.searchParams.keys()]) {
      if (/^(utm_|mc_)/i.test(k) || k === "ct") u.searchParams.delete(k);
    }
    return u.toString();
  } catch (e) {
    return t;
  }
}

// Für "Alternative Bezugsquelle (online)" (Freitext) - erkennt anhand des Textes, welcher
// der bekannten Händler gemeint ist, und grenzt die Suche entsprechend ein, damit ein
// erneuter Preis-/Verfügbarkeits-Check zielgerichtet ist statt nur allgemein zu suchen.
function buildAltSearchUrl(w) {
  const query = `${w.weingut || ""} ${w.weinname || ""}`.trim();
  if (!query) return null;
  const text = (w.alternativeBezugsquelle || "").toLowerCase();
  // Verneinungen wie "nicht gelistet" oder "kein Webshop" bedeuten: der Händler wurde
  // GEPRÜFT, aber NICHT gefunden - dann darf die Suche nicht auf genau diese Seite
  // eingeschränkt werden, sondern muss offen im gesamten Web suchen (z.B. bei einem
  // bisher unbekannten Händler, den man für einen besonders guten Wein in Kauf nimmt).
  const verneint = /nicht|kein/.test(text);
  let domain = null;
  if (!verneint) {
    if (text.includes("tesdorpf")) domain = "tesdorpf.de";
    else if (text.includes("lobenberg")) domain = "gute-weine.de";
    else if (text.includes("wein am limit") || text.includes("weinamlimit")) domain = "weinamlimit.de";
    else if (text.includes("sake kontor") || text.includes("sake-kontor")) domain = "sake-kontor.de";
  }
  if (DIREKTE_SHOPS.includes(domain)) return shopSucheUrl(domain, w);
  if (domain) {
    return `https://www.google.com/search?q=${encodeURIComponent(`site:${domain} ${query}`)}`;
  }
  return `https://www.google.de/search?q=${encodeURIComponent(`${query} kaufen site:.de`)}`;
}

  function resizeImageDataUrl(dataUrl, maxDim = 1400, quality = 0.82) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = dataUrl;
    });
  }

      try {

        setForm((f) => ({ ...f, [field]: url }));

    };
    reader.readAsDataURL(file);
  }

  // Benannte Gastronomie rund um einen Punkt (OpenStreetMap, Overpass)
  async function gastronomieSuche(lat, lon) {
    const query = `[out:json][timeout:10];(node(around:60,${lat},${lon})["amenity"~"^(restaurant|bar|cafe|pub|biergarten|wine_bar)$"]["name"];way(around:60,${lat},${lon})["amenity"~"^(restaurant|bar|cafe|pub|biergarten|wine_bar)$"]["name"];);out center tags 10;`;
    const o = await fetch("https://overpass-api.de/api/interpreter", { method: "POST", body: "data=" + encodeURIComponent(query) });
    const oj = await o.json();
    const seen = new Set();
    return (oj.elements || [])
      .map((e) => ({ name: e.tags.name, website: e.tags.website || e.tags["contact:website"] || "" }))
      .filter((k) => k.name && !seen.has(k.name) && seen.add(k.name));
  }

  // Ort aus GPS-Koordinaten (z. B. aus dem Foto-EXIF): Stadt/Stadtteil, Adresse und Gastronomie in der Nähe
  async function ortAusGps(gpsText) {
    const pos = gpsAusText(gpsText);
    if (!pos) return;
    const [lat, lon] = pos;
    setOrtSuche({ busy: true, msg: "Ort wird aus den GPS-Daten ermittelt …", kandidaten: [] });
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&addressdetails=1&zoom=18&lat=${lat}&lon=${lon}`, { headers: { "Accept-Language": "de" } });
      const d = await r.json();
      const a = d.address || {};
      const stadt = a.city || a.town || a.village || "";
      const stadtteil = a.suburb || a.quarter || a.city_district || "";
      const trinkortNeu = stadtteil && stadt && stadtteil !== stadt ? `${stadt}-${stadtteil}` : (stadtteil || stadt);
      const strasse = [a.road, a.house_number].filter(Boolean).join(" ");
      const adresseNeu = [strasse, [a.postcode, stadt].filter(Boolean).join(" ")].filter(Boolean).join(", ");
      setForm((f) => ({ ...f, trinkort: mitRestaurant(f.trinkort || trinkortNeu, f.restaurantName), trinkortAdresse: f.trinkortAdresse || adresseNeu, trinkortGPS: f.trinkortGPS || `${lat.toFixed(5)}, ${lon.toFixed(5)}` }));
      try {
        const kandidaten = await gastronomieSuche(lat, lon);
        setOrtSuche({ busy: false, msg: kandidaten.length ? "Gastronomie in der Nähe, bitte auswählen:" : "Ort gefunden. Keine benannte Gastronomie in der Nähe.", kandidaten });
      } catch (err) {
        setOrtSuche({ busy: false, msg: "Ort gefunden, aber die Gastronomie-Suche ist gerade nicht erreichbar.", kandidaten: [] });
      }
    } catch (err) {
      setOrtSuche({ busy: false, msg: "Ort aus den GPS-Daten nicht ermittelbar (keine Verbindung).", kandidaten: [] });
    }
  }

  // Adresse über OpenStreetMap (Nominatim) suchen, dann benannte Gastronomie in der Nähe (Overpass) auflisten
  async function ortErmitteln() {
    const q = (form.trinkortAdresse || "").trim();
    if (!q) { setOrtSuche({ busy: false, msg: "Bitte zuerst eine Adresse eingeben.", kandidaten: [] }); return; }
    setOrtSuche({ busy: true, msg: "Suche läuft …", kandidaten: [] });
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=1&q=${encodeURIComponent(q)}`, { headers: { "Accept-Language": "de" } });
      const treffer = await r.json();
      if (!treffer.length) { setOrtSuche({ busy: false, msg: "Adresse nicht gefunden. Bitte genauer eingeben (Straße, Hausnummer, PLZ, Ort).", kandidaten: [] }); return; }
      const lat = parseFloat(treffer[0].lat);
      const lon = parseFloat(treffer[0].lon);
      const a = treffer[0].address || {};
      const stadt = a.city || a.town || a.village || "";
      const stadtteil = a.suburb || a.quarter || a.city_district || "";
      const trinkortNeu = stadtteil && stadt && stadtteil !== stadt ? `${stadt}-${stadtteil}` : (stadtteil || stadt);
      setForm((f) => ({ ...f, trinkort: mitRestaurant(f.trinkort || trinkortNeu, f.restaurantName), trinkortGPS: `${lat.toFixed(5)}, ${lon.toFixed(5)}` }));
      try {
        const query = `[out:json][timeout:10];(node(around:60,${lat},${lon})["amenity"~"^(restaurant|bar|cafe|pub|biergarten|wine_bar)$"]["name"];way(around:60,${lat},${lon})["amenity"~"^(restaurant|bar|cafe|pub|biergarten|wine_bar)$"]["name"];);out center tags 10;`;
        const o = await fetch("https://overpass-api.de/api/interpreter", { method: "POST", body: "data=" + encodeURIComponent(query) });
        const oj = await o.json();
        const seen = new Set();
        const kandidaten = (oj.elements || [])
          .map((e) => ({ name: e.tags.name, website: e.tags.website || e.tags["contact:website"] || "" }))
          .filter((k) => k.name && !seen.has(k.name) && seen.add(k.name));
        setOrtSuche({ busy: false, msg: kandidaten.length ? "Gastronomie in der Nähe, bitte auswählen:" : "Ort gefunden. Keine benannte Gastronomie in der Nähe.", kandidaten });
      } catch (err) {
        setOrtSuche({ busy: false, msg: "Ort gefunden, aber die Gastronomie-Suche ist gerade nicht erreichbar.", kandidaten: [] });
      }
    } catch (err) {
      setOrtSuche({ busy: false, msg: "Suche nicht möglich (keine Verbindung).", kandidaten: [] });
    }
  }

  function sortValue(w, key) {
    switch (key) {
      case "land": return (w.land || "").toLowerCase();
      case "jahrgang": return -(w.jahrgang || 0);
      case "bewertung": return -(w.bewertung || 0);
      case "weingut": return (w.weingut || "").toLowerCase();
      case "traube": return (w.traube || "").toLowerCase();
      case "typ": return (w.typ || "").toLowerCase();
      case "neu": return w.hinzugefuegt ? -new Date(w.hinzugefuegt).getTime() : 0;
      case "anzahlFlaschen": return -(parseFloat(w.anzahlFlaschen) || 0);
      default: return 0;
    }
  }

  const filtered = useMemo(() => {
    let list = [...wines];
    if (suchtext.trim()) {
      const q = suchtext.trim().toLowerCase();
      list = list.filter((w) => {
        const haystack = [
          w.weinname, w.weingut, w.traube, w.land, w.region,
          w.notizen, w.weinbeschreibung, w.speiseempfehlung, w.hintergrundgeschichte,
        ].filter(Boolean).join(" ").toLowerCase();
        return haystack.includes(q);
      });
    }
    if (ansicht === "keller") list = list.filter((w) => w.merkliste !== "Ja");
    if (ansicht === "merkliste") list = list.filter((w) => w.merkliste === "Ja");
    if (filterTyp !== "Alle") list = list.filter((w) => w.typ === filterTyp);
    if (filterLand !== "Alle") list = list.filter((w) => w.land === filterLand);
    if (filterWeingut !== "Alle") list = list.filter((w) => w.weingut === filterWeingut);
    if (filterTraube !== "Alle") list = list.filter((w) => w.traube === filterTraube);
    if (filterJahrgang !== "Alle") list = list.filter((w) => String(w.jahrgang) === String(filterJahrgang));
    if (filterAnzahlFlaschen === "vorhanden") list = list.filter((w) => parseFloat(w.anzahlFlaschen) > 0);
    if (filterAnzahlFlaschen === "keine") list = list.filter((w) => !(parseFloat(w.anzahlFlaschen) > 0));
    if (filterBezugsquelle !== "Alle") list = list.filter((w) => w.bezugsquelle === filterBezugsquelle);
    if (filterFavorit !== "Alle") list = list.filter((w) => (filterFavorit === "Ja" ? w.favorit : !w.favorit));
    if (filterFavoritBJ !== "Alle") list = list.filter((w) => (filterFavoritBJ === "Ja" ? w.favoritBJ : !w.favoritBJ));
    if (filterWiederkaufen !== "Alle") list = list.filter((w) => w.wiederkaufen === filterWiederkaufen);
    if (filterCremig !== "Alle") list = list.filter((w) => w.cremig === filterCremig);
    if (filterNurVorOrt !== "Alle") list = list.filter((w) => w.nurVorOrtErhaeltlich === filterNurVorOrt);

    // Ältere Jahrgänge desselben Weins ausblenden (nur Anzeige, nichts wird gelöscht) -
    // hilfreich für die Frage "was kann ich aktuell nachbestellen?", ohne die Historie/Notizen zu verlieren.
    if (nurNeuesterJahrgang) {
      const neuesterProWein = {};
      wines.forEach((w) => {
        const key = `${weingutNormalisiert(w.weingut)}|${(w.weinname || "").toLowerCase()}`;
        const j = parseInt(w.jahrgang, 10) || 0;
        if (!(key in neuesterProWein) || j > neuesterProWein[key]) neuesterProWein[key] = j;
      });
      list = list.filter((w) => {
        const key = `${weingutNormalisiert(w.weingut)}|${(w.weinname || "").toLowerCase()}`;
        const j = parseInt(w.jahrgang, 10) || 0;
        return j === neuesterProWein[key];
      });
    }

    // Weine ohne Bewertung ausblenden lassen - hilfreich, um gezielt zu sehen,
    // welche gekauften/katalogisierten Weine noch auf eine Verkostung warten.
    if (nurUnbewertet) {
      list = list.filter((w) => !w.bewertung);
    }

    list.sort((a, b) => {
      const v1 = sortValue(a, sortBy1);
      const v2 = sortValue(b, sortBy1);
      if (v1 < v2) return -1;
      if (v1 > v2) return 1;
      if (sortBy2 !== "keine") {
        const s1 = sortValue(a, sortBy2);
        const s2 = sortValue(b, sortBy2);
        if (s1 < s2) return -1;
        if (s1 > s2) return 1;
      }
      return 0;
    });
    return list;
  }, [wines, suchtext, ansicht, filterTyp, filterLand, filterWeingut, filterTraube, filterJahrgang, filterAnzahlFlaschen, filterBezugsquelle, filterFavorit, filterFavoritBJ, filterWiederkaufen, filterCremig, filterNurVorOrt, nurNeuesterJahrgang, nurUnbewertet, sortBy1, sortBy2]);

  // Aktive Filter als Chips (ohne Sortierung und Suchtext)
  const aktiveChips = [
    filterTyp !== "Alle" && `Typ: ${filterTyp}`,
    filterLand !== "Alle" && `Land: ${filterLand}`,
    filterWeingut !== "Alle" && `Weingut: ${filterWeingut}`,
    filterTraube !== "Alle" && `Rebsorte: ${filterTraube}`,
    filterJahrgang !== "Alle" && `Jahrgang: ${filterJahrgang}`,
    filterAnzahlFlaschen !== "Alle" && `Flaschen: ${filterAnzahlFlaschen === "vorhanden" ? "vorhanden" : "keine mehr"}`,
    filterBezugsquelle !== "Alle" && `Bezug: ${filterBezugsquelle}`,
    filterFavorit !== "Alle" && `Favorit: ${filterFavorit === "Ja" ? "ja" : "nein"}`,
    filterFavoritBJ !== "Alle" && `Favorit BJ: ${filterFavoritBJ === "Ja" ? "ja" : "nein"}`,
    filterWiederkaufen !== "Alle" && `Wiederkaufen: ${filterWiederkaufen}`,
    filterCremig !== "Alle" && `Cremig: ${filterCremig}`,
    filterNurVorOrt !== "Alle" && `Nur vor Ort: ${filterNurVorOrt}`,
  ].filter(Boolean);
  const aktiveAnzahl = aktiveChips.length + (nurNeuesterJahrgang ? 1 : 0) + (nurUnbewertet ? 1 : 0);
  const anzahlMerkliste = wines.filter((w) => w.merkliste === "Ja").length;

  function filterZuruecksetzen() {
    setFilterTyp("Alle"); setFilterLand("Alle"); setFilterWeingut("Alle"); setFilterTraube("Alle");
    setFilterJahrgang("Alle"); setFilterAnzahlFlaschen("Alle"); setFilterBezugsquelle("Alle");

  function copyForClaude() {
    const lines = filtered.map((w) => {
      const kurzbeschreibung = w.weinbeschreibung
        ? w.weinbeschreibung.split(/(?<=[.!?])\s+/).slice(0, 1).join(" ")
        : "";
      const parts = [
        `${w.weinname || "—"} (${w.weingut || "?"}${w.jahrgang ? ", " + w.jahrgang : ""})`,
        w.typ && `Typ: ${w.typ}`,
        w.traube && `Rebsorte: ${w.traube}`,
        w.land && `Land: ${w.land}${w.region ? ", " + w.region : ""}`,
        w.saeure && `Säure: ${w.saeure}/5`,
        w.anzahlFlaschen !== "" && w.anzahlFlaschen != null && `Flaschen vorhanden: ${w.anzahlFlaschen}`,
        w.bewertung && `Bewertung: ${w.bewertung}/10`,
        w.speiseempfehlung && `Passt zu: ${w.speiseempfehlung}`,
        kurzbeschreibung && `Beschreibung: ${kurzbeschreibung}`,
        w.notizen && `Notizen: ${w.notizen}`,
      ].filter(Boolean);
      return "- " + parts.join(" | ");
    });
    const text = `Meine Weinliste (${filtered.length} Einträge, aktueller Filter):\n\n${lines.join("\n")}`;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        () => { setCopyFlash(true); setTimeout(() => setCopyFlash(false), 1500); },
        () => setError("Kopieren fehlgeschlagen. Bitte manuell markieren.")
      );
    }
  }

  function exportExcel() {
    const rows = wines.map((w) => ({
      Weingut: w.weingut, Weinname: w.weinname, Land: w.land, Region: w.region,
      Jahrgang: w.jahrgang, Rebsorte: w.traube, "Alkohol (%)": w.alkohol,
      "Säure (1-5)": w.saeure, "Gesamtsäure (g/l)": w.saeureGL, Typ: w.typ, Cremig: w.typ === "Weiß" ? w.cremig : "",
      Bezugsquelle: w.bezugsquelle, "Alternative Bezugsquelle (online)": w.alternativeBezugsquelle, "Link (Händler)": w.link, Merkliste: w.merkliste, Kritiker: w.kritiker, "Weitere Jahrgänge (online)": w.weitereJahrgaenge, "Sake Reis": w.sakeReis, "Sake Präfektur": w.sakePraefektur, "Sake Klasse": w.sakeKlasse, "Sake Poliergrad (%)": w.sakePoliergrad, "Sake SMV": w.sakeSMV, "Sake Trinktemperatur": w.sakeTrinktemp, "Händler-Jahrgang": w.haendlerJahrgang, "Nachkauf-Preis (€)": w.nachkaufPreis, "Nachkauf-Link": w.nachkaufLink, "Nachkauf ausverkauft": w.ausverkauft, "Preis (€)": w.preis, "Anzahl Flaschen": w.anzahlFlaschen, "Bewertung (1-10)": w.bewertung,
      Weinbeschreibung: w.weinbeschreibung, Speiseempfehlung: w.speiseempfehlung, "Region kurz vorgestellt": w.regionBeschreibung, Hintergrundgeschichte: w.hintergrundgeschichte,
      "Wieder kaufen": w.wiederkaufen, Notizen: w.notizen, Favorit: w.favorit ? "Ja" : "Nein", "Favorit BJ": w.favoritBJ ? "Ja" : "Nein",
      Dekantieren: w.dekantieren, "Dekantierzeit (Stunden)": w.dekantierzeit, "Restaurant/Ort": w.restaurantName, "Website Restaurant": w.restaurantWebsite, "Nur vor Ort erhältlich": w.nurVorOrtErhaeltlich,
      "Getrunken in": w.trinkort, "Adresse (Ort)": w.trinkortAdresse, "GPS-Koordinaten": w.trinkortGPS,
      Etikett: w.etikettVorne || "",
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Weinkeller");
    const wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    const blob = new Blob([wbout], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });

    // Dateiname mit Zeitstempel, damit beim wiederholten Sichern eindeutig erkennbar ist,
    // welche Datei die aktuellste ist (statt "weinkeller (1).xlsx", "weinkeller (2).xlsx" ...)
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    const stamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
    const filename = `weinkeller-${stamp}.xlsx`;
    const file = new File([blob], filename, { type: blob.type });

    // "In Dateien sichern" (Teilen-Menü) nur auf iPhone/iPad anbieten - am Mac/Desktop
    // soll ein ganz normaler Browser-Download in den Downloads-Ordner laufen.
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    if (isIOS && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).then(() => setDirty(false)).catch(() => {});
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setDirty(false);
  }

  function wineKey(w) {
    return [weingutNormalisiert(w.weingut), w.weinname, w.jahrgang].join("|").toLowerCase().trim();
  }

  function importExcel(e) {
    const file = e.target.files && e.target.files[0];

    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type: "array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });

        // Abgleich statt Überschreiben: pro Zeile prüfen, ob der Wein (Weingut+Name+Jahrgang)
        // schon in der Cloud existiert, und dann aktualisieren statt zu duplizieren.
        const existingByKey = {};
        wines.forEach((w) => { existingByKey[wineKey(w)] = w; });

        const writes = rows.map((r, i) => {
          const parsed = {
            weingut: String(r["Weingut"] || ""), weinname: String(r["Weinname"] || ""),
            land: String(r["Land"] || ""), region: String(r["Region"] || ""),
            jahrgang: parseInt(r["Jahrgang"], 10) || "", traube: String(r["Rebsorte"] || ""),
            alkohol: String(r["Alkohol (%)"] || ""), saeure: parseInt(r["Säure (1-5)"], 10) || "",
            saeureGL: String(r["Gesamtsäure (g/l)"] || ""),
            typ: String(r["Typ"] || ""), cremig: String(r["Cremig"] || ""),
            bezugsquelle: String(r["Bezugsquelle"] || ""), alternativeBezugsquelle: String(r["Alternative Bezugsquelle (online)"] || ""), link: String(r["Link (Händler)"] || ""), merkliste: String(r["Merkliste"] || ""), kritiker: String(r["Kritiker"] || ""), weitereJahrgaenge: String(r["Weitere Jahrgänge (online)"] || ""), sakeReis: String(r["Sake Reis"] || ""), sakePraefektur: String(r["Sake Präfektur"] || ""), sakeKlasse: String(r["Sake Klasse"] || ""), sakePoliergrad: String(r["Sake Poliergrad (%)"] || ""), sakeSMV: String(r["Sake SMV"] || ""), sakeTrinktemp: String(r["Sake Trinktemperatur"] || ""), haendlerJahrgang: String(r["Händler-Jahrgang"] || ""), nachkaufPreis: String(r["Nachkauf-Preis (€)"] || ""), nachkaufLink: String(r["Nachkauf-Link"] || ""), ausverkauft: String(r["Nachkauf ausverkauft"] || ""), preis: String(r["Preis (€)"] || ""),
            weinbeschreibung: String(r["Weinbeschreibung"] || ""), speiseempfehlung: String(r["Speiseempfehlung"] || ""),
            hintergrundgeschichte: String(r["Hintergrundgeschichte"] || ""),
            regionBeschreibung: String(r["Region kurz vorgestellt"] || ""),
            anzahlFlaschen: String(r["Anzahl Flaschen"] || ""),
            bewertung: parseInt(r["Bewertung (1-10)"], 10) || "",
            wiederkaufen: String(r["Wieder kaufen"] || ""), notizen: String(r["Notizen"] || ""),
            favorit: String(r["Favorit"] || "").toLowerCase() === "ja",
            favoritBJ: String(r["Favorit BJ"] || "").toLowerCase() === "ja",
            dekantieren: String(r["Dekantieren"] || ""), dekantierzeit: String(r["Dekantierzeit (Stunden)"] || ""),
            restaurantName: String(r["Restaurant/Ort"] || ""),
            restaurantWebsite: String(r["Website Restaurant"] || ""),
            trinkort: String(r["Getrunken in"] || ""),
            trinkortAdresse: String(r["Adresse (Ort)"] || ""),
            trinkortGPS: String(r["GPS-Koordinaten"] || ""),
            nurVorOrtErhaeltlich: String(r["Nur vor Ort erhältlich"] || ""),
            etikettVorne: String(r["Etikett"] || ""),
          };
          const existing = existingByKey[wineKey(parsed)];
          const wine = existing
            ? { ...existing, ...parsed, etikettVorne: parsed.etikettVorne || existing.etikettVorne || "" }
            : { ...parsed, id: fb.doc(fb.collection(fb.db, WINES_COLLECTION)).id, hinzugefuegt: new Date().toISOString() };
          return saveWineDoc(fb, wine);
        });

        await Promise.all(writes);
        setDirty(false);
        setError("");
      } catch (err) {
        console.error(err);
        setError("Datei konnte nicht gelesen werden. Bitte eine mit dieser App exportierte Excel-Datei wählen.");
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = "";
  }

function Login() {
  const [fb, setFb] = useState(null);
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    waitForFirebase().then(setFb);
  }, []);

  function submit(e) {
    e.preventDefault();
    if (!fb) return;
    setBusy(true);
    setError("");
    fb.signInWithEmailAndPassword(fb.auth, email.trim(), password)
      .catch((err) => {
        console.error(err);
        setError("Anmeldung fehlgeschlagen. E-Mail oder Passwort prüfen.");
      })
      .finally(() => setBusy(false));
  }

  return (
    <div style={{ minHeight: "100vh", background: "#F5F0E6", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <form onSubmit={submit} style={{ background: "#FFFDF9", border: "1px solid #E5DBC8", borderRadius: 14, padding: 28, width: "100%", maxWidth: 360 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 18 }}>
          <WineIcon size={24} color="#7A2038" />
          <h1 className="display-font" style={{ fontSize: 22, margin: 0 }}>Weinkeller</h1>
        </div>
        <div style={{ marginBottom: 12 }}>
          <label>E-Mail</label>
          <input type="email" autoCapitalize="none" value={email} onChange={(e) => setEmail(e.target.value)} required />
        </div>
        <div style={{ marginBottom: 16 }}>
          <label>Passwort</label>
          <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required />
        </div>
        {error && <div style={{ color: "#B0453F", fontSize: 13, marginBottom: 12 }}>{error}</div>}
        <button type="submit" disabled={busy || !fb} style={{ width: "100%", background: "#7A2038", color: "#FFFDF9", border: "none", borderRadius: 10, padding: 12, fontSize: 14, fontWeight: 600, cursor: busy ? "default" : "pointer", opacity: busy || !fb ? 0.7 : 1 }}>
          {busy ? "Anmelden…" : "Anmelden"}
        </button>
      </form>
    </div>
  );
}

function AuthGate() {
  const [fb, setFb] = useState(null);
  const [user, setUser] = useState(undefined); // undefined = wird noch geprüft, null = nicht angemeldet

  useEffect(() => {
    let unsubscribe = null;
    waitForFirebase().then((fbApi) => {
      setFb(fbApi);
      unsubscribe = fbApi.onAuthStateChanged(fbApi.auth, (u) => setUser(u || null));
    });
    return () => { if (unsubscribe) unsubscribe(); };
  }, []);

  if (user === undefined) {
    return (
      <div style={{ minHeight: "100vh", background: "#F5F0E6", display: "flex", alignItems: "center", justifyContent: "center", color: "#7A6F63", fontSize: 13 }}>
        Anmeldestatus wird geprüft…
      </div>
    );
  }
  if (!user) return <Login />;
  return <Weinkeller onLogout={() => fb.signOut(fb.auth)} />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AuthGate />);
</script>
